name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: >-
          python -m pytest --junitxml=test-results/pytest.xml
          --cov=nucosObs --cov-report=term --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - run: python -m pytest --cov=nucosObs.observable --cov-fail-under=100
      - run: python -m pytest --cov=nucosObs.stdinInterface --cov-fail-under=90
      - run: python -m pytest --cov=nucosObs.twoWayInterface --cov-fail-under=90
      - run: python -m pytest --cov=nucosObs --cov-fail-under=75
      - run: python -m pip wheel --no-deps . --wheel-dir dist